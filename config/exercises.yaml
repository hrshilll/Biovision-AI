# BioVision AI — exercise configuration
# Each exercise defines primary joints, angle thresholds, rep logic, form rules, and scoring weights.

exercises:
  Bicep_curls:
    display_name: "Bicep Curl"
    category: upper_body
    isometric: false
    primary_joints: [elbow_flexion, shoulder_flexion, hip_flexion, knee_flexion]
    legacy_angle_map:
      Elbow_Angle: elbow_flexion
      Shoulder_Angle: shoulder_flexion
      Hip_Angle: hip_flexion
      Knee_Angle: knee_flexion
    angle_thresholds:
      elbow_flexion: {lo: 20, hi: 160, message: "Incomplete elbow range of motion"}
      shoulder_flexion: {lo: 0, hi: 50, message: "Upper arm swinging — using momentum"}
      hip_flexion: {lo: 155, hi: 180, message: "Leaning back — using body swing"}
      knee_flexion: {lo: 155, hi: 180, message: "Knees bending — unstable base"}
    rep_counting:
      angle_key: elbow_flexion
      down_threshold: 135
      up_threshold: 125
      count_on: up
    scoring_weights:
      rom: 0.35
      stability: 0.20
      symmetry: 0.20
      tempo: 0.15
      posture: 0.10
    rule_module: curl_rules

  Pushups:
    display_name: "Pushup"
