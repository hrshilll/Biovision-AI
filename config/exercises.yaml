      shoulder_flexion: {lo: 75, hi: 105, message: "Shoulders not over elbows"}
      hip_flexion: {lo: 155, hi: 180, message: "Hips sagging or piking"}
      knee_flexion: {lo: 155, hi: 180, message: "Knees bent — legs must be straight"}
    rep_counting: null
    scoring_weights:
      rom: 0.10
      stability: 0.40
      symmetry: 0.20
      tempo: 0.10
      posture: 0.20
    rule_module: null

  Squats:
